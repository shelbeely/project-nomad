# Project N.O.M.A.D. — OpenClaw Agent Runtime
#
# This compose file deploys the OpenClaw autonomous agent as a *sibling* to the
# NOMAD managed-services stack.  It shares the same Docker bridge network
# (project-nomad_default) so that OpenClaw can reach every NOMAD container by
# its Docker hostname, e.g.:
#
#   LLM inference   → http://nomad_admin:8080/v1   (NOMAD OpenAI-compat layer)
#   MCP tools       → http://nomad_admin:8080/mcp
#   Ollama direct   → http://nomad_ollama:11434
#   Qdrant          → http://nomad_qdrant:6333
#   Kiwix           → http://nomad_kiwix_server:8080
#
# Prerequisites
#   1. The NOMAD stack must already be running (management_compose.yaml).
#   2. Replace every "replaceme" value before starting.
#
# Usage
#   docker compose -f openclaw_compose.yaml up -d
#
name: openclaw

services:
  openclaw:
    image: openclaw/gateway:latest
    pull_policy: always
    container_name: openclaw_gateway
    restart: unless-stopped
    # Bind only to localhost — access via SSH tunnel or NOMAD reverse proxy.
    # Change to "0.0.0.0:18789:18789" only if you have a reverse-proxy / firewall
    # protecting this port; the gateway has no built-in rate limiting.
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      # Persistent config, memory, and workspace
      - /opt/project-nomad/openclaw/config:/home/node/.openclaw
      - /opt/project-nomad/openclaw/workspace:/home/node/workspace
    environment:
      # -----------------------------------------------------------------------
      # OpenClaw gateway authentication
      # Set a strong random token — this is the password for the web dashboard.
      # -----------------------------------------------------------------------
      - OPENCLAW_GATEWAY_TOKEN=replaceme

      # -----------------------------------------------------------------------
      # LLM backend — point at NOMAD's OpenAI-compatible endpoint so that
      # tool-calling, vision routing, and the agentic loop all go through the
      # same provider-agnostic layer that NOMAD manages.
      # -----------------------------------------------------------------------
      - OPENAI_BASE_URL=http://nomad_admin:8080/v1
      # Use "none" as the key when NOMAD_API_KEY is not set; otherwise set this
      # to match the NOMAD_API_KEY value configured in management_compose.yaml.
      - OPENAI_API_KEY=none

      # -----------------------------------------------------------------------
      # NOMAD MCP tool server — registered automatically so OpenClaw agents can
      # invoke any nomad_* MCP tool (search_knowledge, nomad_chat, etc.)
      # -----------------------------------------------------------------------
      - OPENCLAW_MCP_SERVERS=nomad:http://nomad_admin:8080/mcp
      # If NOMAD_API_KEY is set, pass it here so OpenClaw authenticates:
      # - OPENCLAW_MCP_NOMAD_TOKEN=replaceme

      # -----------------------------------------------------------------------
      # Optional: default model to use (must be available in NOMAD's Ollama)
      # -----------------------------------------------------------------------
      # - OPENCLAW_DEFAULT_MODEL=llama3.2:3b

      # -----------------------------------------------------------------------
      # Workspace / ports
      # -----------------------------------------------------------------------
      - OPENCLAW_WORKSPACE_DIR=/home/node/workspace
      - OPENCLAW_GATEWAY_PORT=18789
    networks:
      - nomad-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ---------------------------------------------------------------------------
# Join the NOMAD Docker network as an external participant.
# The NOMAD management stack must be running first (it creates this network).
# ---------------------------------------------------------------------------
networks:
  nomad-net:
    external: true
    name: project-nomad_default
